name: Deploy to Production

on:
  repository_dispatch:
    types: [deploy-production]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        default: 'ghcr.io/nortastic/dotnovi-2026-04:main'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize image tag
        id: image
        env:
          RAW_IMAGE_TAG: ${{ github.event.client_payload.image_tag || inputs.image_tag || 'ghcr.io/nortastic/dotnovi-2026-04:main' }}
        run: |
          IMAGE_TAG="$(echo "$RAW_IMAGE_TAG" | tr '[:upper:]' '[:lower:]')"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists
        run: |
          docker pull "${{ steps.image.outputs.image_tag }}"

      - name: Deploy to production
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          DEPLOYMENT_ENV: production
        run: |
          echo "Deploying image: $IMAGE_TAG"
          echo "Environment: $DEPLOYMENT_ENV"

      - name: Run smoke tests
        continue-on-error: true
        run: |
          echo "Verifying health check..."
          # Hier kun je eventueel een curl naar je live URL maken

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get previous image tag
        id: previous
        run: |
          echo "image_tag=ghcr.io/nortastic/dotnovi-2026-04:previous" >> "$GITHUB_OUTPUT"

      - name: Rollback to previous version
        env:
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image_tag }}
        run: |
          echo "Rolling back to: $PREVIOUS_IMAGE"